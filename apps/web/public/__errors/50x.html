<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Ginga - Temporariamente indisponivel</title>
  <style>
    :root{color-scheme:dark;--bg:#111318;--panel:#181b22;--line:#2b303a;--text:#f4f5f7;--muted:#a9b0be;--accent:#7658f4;--good:#3bcf8e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#211b3b 0,#111318 34%);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);padding:24px}
    main{width:min(540px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;box-shadow:0 24px 80px #0007}.logo{width:58px;height:58px;margin-bottom:14px}.status{display:inline-flex;align-items:center;gap:8px;color:#cdd3dd;background:#212630;padding:7px 11px;border-radius:999px;font-size:12px;margin-bottom:16px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}h1{margin:0 0 10px;font-size:25px}.muted{color:var(--muted);margin:0 auto 24px;max-width:440px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}a{color:white;text-decoration:none;background:var(--accent);padding:11px 17px;border-radius:10px;font-weight:700}a.secondary{background:#252a35;color:#dfe3ea}
  </style>
</head>
<body><main><img class="logo" src="/ginga-mark.svg" alt="Ginga"><div><span class="status"><span class="dot"></span>Conexao temporariamente indisponivel</span></div><h1>O Ginga nao conseguiu responder agora</h1><p class="muted">O servico pode estar reiniciando ou passando por uma indisponibilidade momentanea. Tente novamente em alguns segundos.</p><div class="actions"><a href="">Tentar novamente</a><a class="secondary" href="/">Pagina inicial</a></div></main></body>
</html>
