load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ginga '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" request_id=$request_id rt=$request_time';

    access_log /dev/stdout ginga;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    client_body_temp_path /tmp/nginx-client 1 2;
    proxy_temp_path /tmp/nginx-proxy 1 2;
    fastcgi_temp_path /tmp/nginx-fastcgi 1 2;
    uwsgi_temp_path /tmp/nginx-uwsgi 1 2;
    scgi_temp_path /tmp/nginx-scgi 1 2;

    server_tokens off;

    # Remove identificacao do servidor inclusive das respostas geradas pelo proprio Nginx.
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    more_clear_headers X-AspNet-Version;
    more_clear_headers X-AspNetMvc-Version;
    more_clear_headers X-Runtime;
    more_clear_headers Via;

    include /etc/nginx/http.d/*.conf;
}
