map $http_x_forwarded_proto $ginga_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $ginga_forwarded_proto $ginga_hsts {
    default "";
    https   "max-age=15552000";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    client_max_body_size 64m;
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    # Paginas proprias: nunca entregar a pagina padrao do servidor web.
    error_page 400 401 403 405 408 413 414 429 /__errors/4xx.html;
    error_page 404 /__errors/404.html;
    error_page 500 502 503 504 /__errors/50x.html;

    location = /__errors/4xx.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = /__errors/404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = /__errors/50x.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    # Falhas de backend retornam JSON neutro e nunca detalhes do upstream.
    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 503 '{"error":"service_unavailable","message":"Servico temporariamente indisponivel. Tente novamente em instantes.","requestId":"$request_id"}';
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ginga_forwarded_proto;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Via;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @backend_unavailable;
    }

    location /uploads/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ginga_forwarded_proto;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Via;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @backend_unavailable;
    }

    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ginga_forwarded_proto;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Via;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @backend_unavailable;
    }

    # O updater precisa continuar servindo latest.yml, manifests e executaveis.
    location ^~ /updates/ {
        try_files $uri =404;
        etag off;
        if_modified_since off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }

    # Nao expor dotfiles, repositorio, segredos, chaves, backups ou source maps.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|sqlite|db|bak|backup|old|orig|save|swp|pem|key|p12|pfx|conf|toml|lock|map)$ {
        return 404;
    }

    location ~* ^/(?:Dockerfile|docker-compose(?:\.[^/]+)?\.ya?ml|package(?:-lock)?\.json|tsconfig(?:\.[^/]+)?\.json|vite\.config\.[cm]?[jt]s|nginx(?:-main)?\.conf)$ {
        return 404;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $ginga_hsts always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.sndcdn.com; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://w.soundcloud.com; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security $ginga_hsts always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.sndcdn.com; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://w.soundcloud.com; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
