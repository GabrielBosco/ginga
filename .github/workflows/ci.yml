name: Validação do projeto

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar repositório
        run: bash ./scripts/prepare-github.sh

      - name: Compilar API
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build

      - name: Compilar Web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validar sintaxe do Desktop
        run: |
          node --check apps/desktop/src/main.cjs
          node --check apps/desktop/src/preload.cjs
          if [ -f apps/desktop/src/game-overlay-preload.cjs ]; then node --check apps/desktop/src/game-overlay-preload.cjs; fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Ginga Bot SDK
        run: |
          python -m compileall -q sdk/python/gingabot
          python -m pip install --no-cache-dir -e ./sdk/python
          python - <<'PY'
          import gingabot
          assert gingabot.Bot
          assert gingabot.Intents
          print("Ginga Bot SDK", gingabot.__version__, "OK")
          PY
          python -m unittest discover -s sdk/python/tests -v
